services:
  api:
    build: ./api
    environment:
      - NEIS_API_KEY=${NEIS_API_KEY:?NEIS_API_KEY is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - API_UPSTREAM=api:8000
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    networks:
      - internal

networks:
  internal:
    driver: bridge
